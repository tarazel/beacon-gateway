name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    # Drafts from the support app are machine-written: nothing in them runs until a
    # person has reviewed the code and marked the pull request ready.
    if: "!(github.event.pull_request.draft && startsWith(github.head_ref, 'support/'))"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: make build

  # A merge to main publishes the image, so prove it builds first.
  image:
    if: github.event_name == 'pull_request' && !(github.event.pull_request.draft && startsWith(github.head_ref, 'support/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build .
