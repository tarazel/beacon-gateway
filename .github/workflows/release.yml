name: Release

# Manual escape hatch: push a tag by hand (e.g. to re-cut a release from an
# older commit) and this builds+publishes it. Normal merges to main are
# released automatically by auto-release.yml instead.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tarazel/beacon-gateway:${{ github.ref_name }}
            ghcr.io/tarazel/beacon-gateway:latest

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment: a tag name is attacker-influenced text
          # and must never be spliced into the shell command itself.
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes --title "$TAG"
