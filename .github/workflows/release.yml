name: Release

# Manual escape hatch: push a tag by hand (e.g. to re-cut a release from an
# older commit) and this builds+publishes it. Normal merges to main are
# released automatically by auto-release.yml instead.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tarazel/beacon-gateway:${{ github.ref_name }}
            ghcr.io/tarazel/beacon-gateway:latest

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --generate-notes --title ${{ github.ref_name }}
