name: Auto Release

# Every merge to main cuts a release: bump the patch version, push the tag,
# build+push the multi-arch image, and create the GitHub release — no manual
# tagging step. Override the bump by putting one of the tags below anywhere
# in the merge commit message; skip the release entirely with [skip release]
# (that one's a literal-substring `contains()` check in this file's own `if:`
# below, not the tag-bump action's matcher, so it's unaffected by the two
# gotchas documented here).
#
#   bump:major   bump:minor   bump:patch   bump:none
#
# Two incidents on 2026-08-02, in order:
#   1. The PR that first added this workflow described the tag-bump action's
#      *default* tokens (#major / #minor) in its own commit message. The
#      action scans commit messages since the last tag by default, read its
#      own documentation as an instruction, and self-triggered an unintended
#      major bump (v1.0.0 -> v2.0.0). Mitigated two ways: switched to
#      distinct, non-default tokens, and set BRANCH_HISTORY=last (below) so
#      only the one commit being pushed is scanned, not the full range since
#      the last tag.
#   2. The distinct tokens chosen were bracketed (`[release:major]` etc).
#      The action matches tokens via a bash `case "$log" in *$token* )`
#      pattern — a *glob* match, not literal substring or regex. Square
#      brackets in a glob are a character class: `[release:major]` matched
#      any single occurrence of any of the letters r/e/l/a/s/:/m/j/o, i.e.
#      nearly any commit message, and self-triggered *another* unintended
#      major bump on the very next merge (the PR fixing incident 1).
#      Current tokens avoid all glob/regex-special characters
#      (`* ? [ ] ( ) !`) for exactly this reason — verify locally with
#      `case "$log" in *bump:major*) ... esac` before ever changing these.
#
# This does its own tag+build+release in one job rather than relying on the
# tag push to trigger release.yml (the tag-triggered workflow), because a tag
# pushed with the default GITHUB_TOKEN does not trigger other workflow runs.
# release.yml is kept as-is as a manual escape hatch for hand-pushed tags.

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
          RELEASE_BRANCHES: main
          BRANCH_HISTORY: last
          MAJOR_STRING_TOKEN: "bump:major"
          MINOR_STRING_TOKEN: "bump:minor"
          PATCH_STRING_TOKEN: "bump:patch"
          NONE_STRING_TOKEN: "bump:none"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tarazel/beacon-gateway:${{ steps.tag.outputs.new_tag }}
            ghcr.io/tarazel/beacon-gateway:latest

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ steps.tag.outputs.new_tag }} --generate-notes --title ${{ steps.tag.outputs.new_tag }}
